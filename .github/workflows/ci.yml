name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # UV_FROZEN already refuses to touch uv.lock and fails if it would have to, so
  # no step may also pass --locked: uv rejects that combination outright. Setting
  # it for the whole workflow keeps sync, run, and build consistent, and
  # astral-sh/setup-uv sets the same variable itself.
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned to match `build-system.requires` in pyproject.toml so CI
          # exercises the same build backend as local development.
          version: "0.12.4"
          enable-cache: true

      - name: Resolve interpreter
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

      - name: Static types (pyright strict)
        run: uv run pyright

      - name: Tests
        run: uv run pytest --cov=psd --cov-report=term-missing

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

  wheel-smoke:
    name: wheel smoke / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.4"
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Install the built wheel into a clean environment
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl)
          uv venv --python ${{ matrix.python-version }} /tmp/psd-wheel-smoke
          VIRTUAL_ENV=/tmp/psd-wheel-smoke uv pip install "$WHEEL"
          /tmp/psd-wheel-smoke/bin/psd --help || /tmp/psd-wheel-smoke/Scripts/psd.exe --help

      - name: Verify wheel import, version, and canonical schema registry
        shell: bash
        run: |
          set -euo pipefail
          BIN=/tmp/psd-wheel-smoke/bin/psd
          EXE=/tmp/psd-wheel-smoke/Scripts/psd.exe
          if [ -x "$BIN" ]; then PSD="$BIN"; else PSD="$EXE"; fi
          "$PSD" version
          "$PSD" schema version
          "$PSD" schema list

      - name: Verify the corpus command group survives the wheel
        shell: bash
        run: |
          set -euo pipefail
          BIN=/tmp/psd-wheel-smoke/bin/psd
          EXE=/tmp/psd-wheel-smoke/Scripts/psd.exe
          if [ -x "$BIN" ]; then PSD="$BIN"; else PSD="$EXE"; fi
          # Every subcommand is checked, not just the group. A command group whose
          # subcommands are registered conditionally would import cleanly and then fail
          # only for an operator, on a machine nobody re-tests by hand.
          for command in acquire inspect build audit verify; do
            "$PSD" openpowerlifting "$command" --help >/dev/null
          done
        env:
          PSD_SMOKE_OK: "1"
