name: CI

# Two paths with different jobs, on purpose.
#
# `hosted-linux-quality` is the broad regression gate and owns everything general: lint,
# format, strict types, the whole test suite with coverage, the build, and a clean wheel
# smoke. `self-hosted-windows-parity` is a narrow portability gate on the maintainer's
# Windows workstation. It runs one marked subset of the suite, a tiny PSD-COMP fixture
# build, and a wheel smoke -- never the full corpus, never the full suite, never a service
# container. Full Windows qualification for a release lives in
# `.github/workflows/windows-full-qualification.yml` and is manual on purpose.
#
# Do not add work to the self-hosted job for symmetry. Ubuntu already proves general
# correctness; Windows proves Windows portability. Duplicating the former into the latter
# costs the workstation minutes on every push and finds nothing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Per-ref group, so a new push supersedes the run it replaces rather than queueing behind
# it. On the self-hosted runner this is the difference between one job and a backlog.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # UV_FROZEN already refuses to touch uv.lock and fails if it would have to, so
  # no step may also pass --locked: uv rejects that combination outright. Setting
  # it for the whole workflow keeps sync, run, and build consistent, and
  # astral-sh/setup-uv sets the same variable itself.
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"
  # Pinned to match `build-system.requires` in pyproject.toml so CI exercises the same
  # build backend as local development.
  UV_VERSION: "0.12.4"

jobs:
  hosted-linux-quality:
    name: hosted-linux-quality / py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Resolve interpreter
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

      - name: Static types (pyright strict)
        run: uv run pyright

      - name: Tests
        run: uv run pytest --cov=psd --cov-report=term-missing

      - name: Build distributions
        run: uv build

      - name: Clean wheel smoke
        run: uv run python scripts/wheel_smoke.py

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-py3.12
          path: dist/
          if-no-files-found: error

  hosted-linux-wheel-smoke:
    name: hosted-linux wheel smoke
    runs-on: ubuntu-latest
    needs: hosted-linux-quality
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Build distributions
        run: uv build

      # A clean environment with nothing but the wheel in it, on the same interpreter the
      # quality job proved. Separate from that job so a wheel-smoke failure is visibly a
      # packaging failure rather than a test failure.
      - name: Clean wheel smoke
        run: uv run python scripts/wheel_smoke.py

  self-hosted-windows-parity:
    name: self-hosted-windows-parity
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # No setup-node, no Docker, no service containers, no Python setup action: the
      # runner already has a Python, and uv resolves and caches the locked environment.
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --all-groups

      # The selection is the marker, not a list of paths, and it is bounded: no `-n auto`,
      # no xdist, no Hypothesis profile bump. Parallelism here would buy seconds on a
      # workstation and cost determinism everywhere.
      - name: Platform-contract tests
        run: uv run pytest -m windows_parity -q

      - name: Tiny PSD-COMP fixture build and verify
        run: uv run python scripts/tiny_psd_comp.py --data-root "${{ runner.temp }}/psd-parity"

      - name: Build distributions
        run: uv build

      - name: Clean wheel and CLI smoke
        run: uv run python scripts/wheel_smoke.py

      # The data root and the fixture source are the only things this job writes, and both
      # are inside the runner's own temp directory, so there is nothing large to clean. This
      # still runs when a step failed, which is when a failing run is most worth inspecting.
      - name: Remove parity scratch
        if: always()
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "${{ runner.temp }}/psd-parity"